title: blank
first_name: Seokbin
last_name: Yoon
lang: en
url: https://seokbinyoon96.github.io
baseurl: ""
description: Seokbin Yoon is a Ph.D. student at George Washington University working on machine learning, autonomous systems, and air traffic control.
max_width: 900px
navbar_fixed: true
footer_fixed: false
sass:
  style: compressed
exclude:
  # Remove these two exclusions when reopening the blog.
  - blog
  - _posts
  - docs
  - tests
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - LICENSE-al-folio
  - THIRD_PARTY.md

# Blog posts are published only on /blog/, not on the homepage.
timezone: America/New_York
future: false
show_drafts: false
permalink: /blog/:title/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Hide blog navigation while posts are being edited.
blog_enabled: false
